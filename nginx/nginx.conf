# ==============================================================================
# CONFIGURACIÓN NGINX REVERSE PROXY - ESTÁNDAR PLAI v1.0
# Plataforma de Gestión de Recursos, Laboratorios y Espacios PLAi
# ==============================================================================

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Seguridad: Ocultar número de versión de Nginx
  server_tokens off;

  # Optimización de transferencias
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10M;

  # Rutas de almacenamiento temporal con permisos no root
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Formato de logs institucional
  log_format plai_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent"'
  '}';

  access_log /var/log/nginx/access.log plai_json;

  # Compresión GZIP para activos estáticos
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # Rate limiting general por IP
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

  # Upstream apuntando al contenedor de Next.js en la red interna aislada
  upstream nextjs_backend {
    server app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Cabeceras de seguridad institucional (complementarias a las de Next.js)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Activos estáticos de Next.js (Caché inmutable)
    location /_next/static/ {
      proxy_pass http://nextjs_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # Endpoint de verificación de salud (sin rate limit)
    location = /api/health {
      proxy_pass http://nextjs_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      access_log off;
    }

    # Endpoints de autenticación con rate limiting estricto
    location /api/auth/ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://nextjs_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    # Resto de la aplicación
    location / {
      limit_req zone=general_limit burst=30 nodelay;
      proxy_pass http://nextjs_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;

      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
