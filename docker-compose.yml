# ==============================================================================
# Stack de Docker Swarm (Estándar PLAi v1.0)
# Despliegue recomendado: VERSION=1.0.0 ./deploy-production.sh
#
# IMPORTANTE:
# Sustituir TODOS los valores marcados en MAYÚSCULAS
# (`AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_...`) por las direcciones, nombres
# de red, registro privado y secretos institucionales reales de PLAi.
#
# Arquitectura de red (TLS Passthrough):
#   1. Red externa de Traefik/Gateway: reenvía tráfico TLS directo (passthrough)
#      al puerto 8443 del servicio `nginx-plai-recursos`.
#   2. `plai_isolated_backend` (internal: true, encrypted: true): red privada y
#      cifrada entre `nginx-plai-recursos` y `plai-recursos-app:3000`. La app NO publica puertos.
#   3. `plai_app_egress` (encrypted: true): red de salida controlada para que
#      `plai-recursos-app` alcance Keycloak OIDC y la API de Directus (admin.plai.mx).
# ==============================================================================

services:
  nginx-plai-recursos:
    image: ${REGISTRY:?Debes exportar REGISTRY}/plai-recursos-nginx:${VERSION:-1.0.0}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
      # Nota: Docker aplica su perfil seccomp por defecto automáticamente.
      # Si PLAi exige un perfil corporativo propio en el nodo, añadir:
      # - seccomp:/etc/docker/seccomp/plai-default.json
    environment:
      ALLOWED_HOST: AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_DOMINIO_INSTITUCIONAL_PLAI
      SSL_CERT_FILE: /etc/nginx/ssl/fullchain.pem
      SSL_KEY_FILE: /etc/nginx/ssl/privkey.pem
      # Rango CIDR de la red overlay de Traefik (plai_gateway_net) para validar PROXY protocol v2.
      # Ajustar al CIDR exacto de la red overlay en producción (acepta varios separados por coma/espacio).
      TRUSTED_PROXY_CIDR: 10.0.0.0/8
    volumes:
      # Certificados TLS en el host (alineado con el script de renovación Let's Encrypt de PLAi).
      # El directorio del host debe ser legible por UID 101 (nginx) y se monta read-only.
      - type: bind
        source: /opt/plai/plai-recursos/ssl/AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_DOMINIO_INSTITUCIONAL_PLAI
        target: /etc/nginx/ssl
        read_only: true
      # mode: 1023 (equivalente decimal de 01777 octal; Docker Swarm ignora notación octal con 0 inicial)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 33554432
          mode: 1023
      - type: tmpfs
        target: /var/cache/nginx
        tmpfs:
          size: 33554432
          mode: 1023
      - type: tmpfs
        target: /var/run
        tmpfs:
          size: 8388608
          mode: 1023
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
        reservations:
          cpus: "0.05"
          memory: 64M
      restart_policy:
        condition: on-failure
      # Nota: Configurar el router TCP con TLS passthrough + PROXY protocol v2
      # (`proxyProtocol.version: 2`) en el dynamic.yml de Traefik apuntando a
      # `plai-recursos_nginx-plai-recursos:8443` (HostSNI del dominio PLAi).
      # Ambos cambios (listen ... proxy_protocol y dynamic.yml) deben activarse juntos.
    networks:
      - plai_gateway_net
      - plai_isolated_backend

  plai-recursos-app:
    image: ${REGISTRY:?Debes exportar REGISTRY}/plai-recursos-espacios:${VERSION:-1.0.0}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
      # Si PLAi exige un perfil seccomp corporativo propio en el nodo, añadir:
      # - seccomp:/etc/docker/seccomp/plai-default.json
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_DOMINIO_INSTITUCIONAL_PLAI
      NEXTAUTH_URL: https://AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_DOMINIO_INSTITUCIONAL_PLAI
      NEXTAUTH_SECRET_FILE: /run/secrets/plai_recursos_nextauth_secret
      KEYCLOAK_ISSUER: https://AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_URL_KEYCLOAK_INSTITUCIONAL/realms/AQUI_REALM_PLAI
      KEYCLOAK_ID_FILE: /run/secrets/plai_recursos_keycloak_id
      KEYCLOAK_SECRET_FILE: /run/secrets/plai_recursos_keycloak_secret
      DIRECTUS_URL: https://AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_URL_DIRECTUS_ADMIN_PLAI
      DIRECTUS_COLLECTION_PREFIX: lab_recursos_
      DIRECTUS_TOKEN_FILE: /run/secrets/plai_recursos_directus_token
    secrets:
      - plai_recursos_nextauth_secret
      - plai_recursos_keycloak_id
      - plai_recursos_keycloak_secret
      - plai_recursos_directus_token
    volumes:
      # mode: 1023 (equivalente decimal de 01777 octal; Docker Swarm ignora notación octal con 0 inicial)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 33554432
          mode: 1023
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          size: 67108864
          mode: 1023
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure
    networks:
      - plai_isolated_backend
      - plai_app_egress
    # Sin puertos publicados: el tráfico entrante solo llega desde nginx-plai-recursos por plai_isolated_backend.

networks:
  # Red overlay del Traefik/Gateway de PLAi (reemplazar el nombre externo real)
  plai_gateway_net:
    external: true
    name: AQUI_HACER_CAMBIOS_CORRESPONDIENTES_CON_RED_EXTERNA_SWARM_PLAI
  # Red interna, aislada y cifrada entre nginx-plai-recursos y Next.js
  plai_isolated_backend:
    driver: overlay
    internal: true
    driver_opts:
      encrypted: "true"
  # Red de salida (egress) cifrada para que Next.js alcance Keycloak OIDC y Directus API
  plai_app_egress:
    driver: overlay
    driver_opts:
      encrypted: "true"
      com.docker.network.bridge.enable_icc: "false"

secrets:
  plai_recursos_nextauth_secret:
    external: true
  plai_recursos_keycloak_id:
    external: true
  plai_recursos_keycloak_secret:
    external: true
  plai_recursos_directus_token:
    external: true
